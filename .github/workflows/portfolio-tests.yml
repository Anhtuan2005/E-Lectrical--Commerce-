name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Techvora_Test_Only123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Techvora_Test_Only123!' -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      TECHVORA_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Techvora_Test_Only123!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/EcommerceApp.Tests/EcommerceApp.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
